name: testing1628

on:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Create a symlinked cycle inside the workspace
        run: |
           mkdir -p "$GITHUB_WORKSPACE/symlink-test/real"
           echo '{"volta": {"extends": "./loop/pkg.json"}}' > "$GITHUB_WORKSPACE/symlink-test/real/pkg.json"
           ln -s "$GITHUB_WORKSPACE/symlink-test/real" "$GITHUB_WORKSPACE/symlink-test/real/loop"
      - id: setup
        continue-on-error: true
        uses: v-gowridurgad/setup-node@fix-1628
        with:
          node-version-file: /tmp/real/pkg.json
     
