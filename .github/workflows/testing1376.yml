name: 418-B - Oversized decimals

on: workflow_dispatch

jobs:
  bigdigits:
    runs-on: ubuntu-24.04
    steps:
      # - uses: v-gowridurgad/setup-python@testing-1376
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.0'

      - name: 5000-digit Decimal round-trips
        run: |
          python -c "
          from decimal import Decimal, getcontext
          getcontext().prec = 10000
          s = str(Decimal('9'*5000))
          assert len(s) == 5000, len(s)
          print('5000-digit OK')
          "

      - name: Heavy arithmetic above the fallback limit
        run: |
          python -c "
          from decimal import Decimal, getcontext
          getcontext().prec = 12000
          a = Decimal('9'*6000)
          b = Decimal('7'*6000)
          print('product digits:', len(str(a*b)))
          print('sqrt digits:', len(str(a.sqrt())))
          "
