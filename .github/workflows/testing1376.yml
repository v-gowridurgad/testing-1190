
name: Repro _decimal on Python 3.15.0 (Ubuntu)

on:
  workflow_dispatch:

jobs:
  repro:
    name: Repro - toolcache 3.15.0 has no _decimal
    runs-on: ubuntu-24.04

    steps:
      # Step 1: Set up Python 3.15.0
      - name: Set up Python 3.15.0
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.0"

      # Step 2: Install build dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git pkg-config libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev libsqlite3-dev libffi-dev \
            liblzma-dev libncurses-dev libgdbm-dev libgdbm-compat-dev \
            uuid-dev tk-dev

      # Step 3: Build Python 3.15 with C decimal support
      - name: Build Python 3.15 with C decimal support
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch v3.15.0 \
            https://github.com/python/cpython.git \
            "$RUNNER_TEMP/cpython-315"

          cd "$RUNNER_TEMP/cpython-315"

          ./configure \
            --prefix="$RUNNER_TEMP/python-315" \
            --without-system-libmpdec \
            --with-ensurepip=install

          make -j2
          make install

          "$RUNNER_TEMP/python-315/bin/python3.15" -c \
            "import _decimal; print(_decimal.__libmpdec_version__)"

          echo "$RUNNER_TEMP/python-315/bin" >> "$GITHUB_PATH"

      # Step 4: Run with the rebuilt Python
      - name: Run with the rebuilt Python
        shell: bash
        run: |
          python3.15 -m pip --version
          python3.15 -c "import _decimal"
