name: Python decimal workaround
on: workflow_dispatch

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git pkg-config libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev libsqlite3-dev libffi-dev \
            liblzma-dev libncurses-dev libgdbm-dev libgdbm-compat-dev \
            uuid-dev tk-dev

      - name: Build Python with C decimal support
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import platform; print(platform.python_version())')"
          git clone --depth 1 --branch "v$version" \
            https://github.com/python/cpython.git \
            "$RUNNER_TEMP/cpython-315"
          cd "$RUNNER_TEMP/cpython-315"
          ./configure \
            --prefix="$RUNNER_TEMP/python-315" \
            --without-system-libmpdec \
            --with-ensurepip=install
          make -j"$(nproc)"
          make install
          "$RUNNER_TEMP/python-315/bin/python3" -c \
            "import _decimal; print(_decimal.__libmpdec_version__)"
          echo "$RUNNER_TEMP/python-315/bin" >> "$GITHUB_PATH"

      - name: Use rebuilt Python
        run: |
          python3 --version
          python3 -c "import _decimal"
          python3 -m pip --version
