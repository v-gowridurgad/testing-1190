name: Repro _decimal on Python 3.15 and 3.16 (Ubuntu)

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        python-version: [
          "3.15.0",
          "3.15.1",
          "3.15.2",
          "3.15.3",
          "3.16.0-alpha.2"
        ]

    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Display Python version
        run: python --version

      - name: Reproduce _decimal import
        run: python -c "import _decimal"
