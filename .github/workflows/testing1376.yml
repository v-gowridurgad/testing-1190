name: 418-F - Real-world usage

on: workflow_dispatch

jobs:
  consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: v-gowridurgad/setup-python@testing-1376
        with:
          python-version: '3.15.0'

      - name: Decimal-heavy stdlib paths
        run: |
          python -c "
          import json, decimal
          from decimal import Decimal
          d = json.loads('1.0000000000000000000000001', parse_float=Decimal)
          print('json Decimal:', d, type(d))
          import csv, io, statistics
          vals = [Decimal('1.1'), Decimal('2.2'), Decimal('3.3')]
          print('mean:', statistics.mean(vals))
          "

      - name: CPython's own decimal test suite
        run: python -m test test_decimal -v 2>&1 | tail -30
