name: 418-C - Static libmpdec link

on: workflow_dispatch

jobs:
  staticlink:
    runs-on: ubuntu-24.04
    steps:
      - uses: v-gowridurgad/setup-python@testing-1376
        with:
          python-version: '3.15.0'

      - name: No dynamic libmpdec dependency
        run: |
          SO=$(python -c "import _decimal; print(_decimal.__file__)")
          echo "module: $SO"
          ldd "$SO" || true
          if ldd "$SO" | grep -qi mpdec; then
            echo "FAIL: dynamic libmpdec dependency found"
            exit 1
          fi
          echo "OK: statically linked"

      - name: mpd_* symbols stay private
        run: |
          SO=$(python -c "import _decimal; print(_decimal.__file__)")
          if nm -D "$SO" 2>/dev/null | grep -q " T mpd_"; then
            echo "FAIL: mpd_* exported, -fvisibility=hidden not applied"
            exit 1
          fi
          echo "OK: mpd_* not exported"

      - name: Confirm no system libmpdec exists on this runner
        run: |
          dpkg -l | grep -i mpdec || echo "No mpdec package installed - good, proves static link"
          ldconfig -p | grep -i mpdec || echo "No libmpdec.so on system - module still works"
