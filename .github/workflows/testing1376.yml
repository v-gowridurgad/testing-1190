name: 418-E - Older versions unaffected

on: workflow_dispatch

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        pyver: ['3.12.11', '3.13.9', '3.14.8']
    runs-on: ubuntu-24.04
    steps:
      - uses: v-gowridurgad/setup-python@testing-1376
        with:
          python-version: ${{ matrix.pyver }}

      - name: _decimal still works via bundled libmpdec
        run: |
          python -VVV
          python -c "import _decimal; print(_decimal.__file__)"
          python -c "import decimal; print('libmpdec:', decimal.__libmpdec_version__)"
          python -c "
          from decimal import Decimal, getcontext
          getcontext().prec = 10000
          assert len(str(Decimal('9'*5000))) == 5000
          print('5000-digit OK')
          "
