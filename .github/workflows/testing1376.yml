name: testing-1376
on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.0"

      - name: Repro
        continue-on-error: true
        run: python -c "import _decimal"

      - run: |
         sudo add-apt-repository -y ppa:deadsnakes/ppa
         sudo apt-get update
         sudo apt-get install -y python3.15 python3.15-venv


      - name: Verify
        run: python3 -c "import _decimal; print('ok:', _decimal.__file__)"
