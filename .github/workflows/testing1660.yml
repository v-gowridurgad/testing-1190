name: testing mise

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [node, latest, current]
    steps:
      - uses: actions/checkout@v7
      # - uses: v-gowridurgad/setup-node@fix-1660
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --version
