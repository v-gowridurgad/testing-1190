name: testing 1660

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [node, latest, current]
    steps:
      - uses: actions/checkout@v7
      # - uses: v-gowridurgad/setup-node@fix-1660
      - uses: actions/setup-node@v7
      
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --version
