name: mirror-auth-behavior-single

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Start local mirror (auth optional, logs token kind)
        id: mirror
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "authorization=Bearer $TOKEN" >> "$GITHUB_OUTPUT"
          export MIRROR_AUTH="Bearer $TOKEN"

          cat > "$RUNNER_TEMP/node-mirror.py" <<'PY'
          import hmac
          import os
          import shutil
          import urllib.error
          import urllib.request
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Mirror(BaseHTTPRequestHandler):
              def do_GET(self):
                  supplied = self.headers.get("Authorization", "")
                  expected = os.environ["MIRROR_AUTH"]

                  if supplied == "":
                      token_kind = "none"
                  elif hmac.compare_digest(supplied, expected):
                      token_kind = "mirror-token"
                  else:
                      token_kind = "other-token"

                  print(f"MIRROR_REQ token={token_kind} path={self.path}", flush=True)

                  # auth optional
                  if not self.path.startswith("/dist/"):
                      self.send_error(404)
                      return

                  try:
                      upstream = urllib.request.urlopen("https://nodejs.org" + self.path, timeout=120)
                  except urllib.error.HTTPError as error:
                      self.send_error(error.code, "Upstream HTTP error")
                      return
                  except urllib.error.URLError:
                      self.send_error(502, "Cannot reach upstream")
                      return

                  with upstream:
                      self.send_response(200)
                      self.end_headers()
                      shutil.copyfileobj(upstream, self.wfile)

          ThreadingHTTPServer(("127.0.0.1", 8765), Mirror).serve_forever()
          PY

          python3 -u "$RUNNER_TEMP/node-mirror.py" > "$RUNNER_TEMP/node-mirror.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/node-mirror.pid"

          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8765/dist/index.json \
            --output /dev/null

      - name: Isolate tool cache and clear mirror log
        run: |
          set -euo pipefail
          echo "RUNNER_TOOL_CACHE=${RUNNER_TEMP}/tc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          rm -rf "${RUNNER_TEMP}/tc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${RUNNER_TEMP}/tc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          : > "$RUNNER_TEMP/node-mirror.log"

      - name: Setup Node via mirror (no mirror-token)
        id: setup
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: '11.15.0'
          check-latest: true
          token: ${{ github.token }}
          mirror: http://127.0.0.1:8765
          mirror-token: ''
          package-manager-cache: false

      - name: Show mirror auth evidence
        if: always()
        run: |
          set -euo pipefail
          echo "setup outcome=${{ steps.setup.outcome }}"
          echo "---- mirror requests ----"
          grep -a '^MIRROR_REQ ' "$RUNNER_TEMP/node-mirror.log" || true
          echo "---- token counts ----"
          echo "none:         $(grep -a -c 'token=none' "$RUNNER_TEMP/node-mirror.log" || true)"
          echo "mirror-token: $(grep -a -c 'token=mirror-token' "$RUNNER_TEMP/node-mirror.log" || true)"
          echo "other-token:  $(grep -a -c 'token=other-token' "$RUNNER_TEMP/node-mirror.log" || true)"

      - name: Stop local mirror
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/node-mirror.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/node-mirror.pid")"
          fi
