name: Compare setup-node mirror credentials

on:
  push:

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: v6
            github-outcome: success
          - variant: pr-1669
            github-outcome: success

    defaults:
      run:
        shell: bash

    steps:

      - name: Isolate and clear tool-cache roots for this run
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/tc-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}-github"
          rm -rf "${RUNNER_TEMP}/tc-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}-mirror"    

      - name: Start temporary authenticated mirror
        id: mirror
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "authorization=Bearer $TOKEN" >> "$GITHUB_OUTPUT"
          export MIRROR_AUTH="Bearer $TOKEN"

          cat > "$RUNNER_TEMP/node-mirror.py" <<'PY'
          import hmac
          import os
          import shutil
          import urllib.error
          import urllib.request
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Mirror(BaseHTTPRequestHandler):
              def do_GET(self):
                  supplied = self.headers.get("Authorization", "")
                  expected = os.environ["MIRROR_AUTH"]

                  if supplied == "":
                      token_kind = "none"
                  elif hmac.compare_digest(supplied, expected):
                      token_kind = "mirror-token"
                  else:
                      token_kind = "other-token"

                  print(f"MIRROR_REQ token={token_kind} path={self.path}", flush=True)

                  if not hmac.compare_digest(supplied, expected):
                      self.send_error(401, "Invalid mirror token")
                      return

                  if not self.path.startswith("/dist/"):
                      self.send_error(404)
                      return

                  try:
                      upstream = urllib.request.urlopen(
                          "https://nodejs.org" + self.path, timeout=120
                      )
                  except urllib.error.HTTPError as error:
                      self.send_error(error.code, "Upstream HTTP error")
                      return
                  except urllib.error.URLError:
                      self.send_error(502, "Cannot reach upstream")
                      return

                  with upstream:
                      self.send_response(200)
                      self.end_headers()
                      shutil.copyfileobj(upstream, self.wfile)

          ThreadingHTTPServer(("127.0.0.1", 8765), Mirror).serve_forever()
          PY

          python3 -u "$RUNNER_TEMP/node-mirror.py" > "$RUNNER_TEMP/node-mirror.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/node-mirror.pid"

          # readiness probes (these are not setup-node behavior)
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            -H "Authorization: $MIRROR_AUTH" \
            http://127.0.0.1:8765/dist/index.json \
            --output /dev/null

          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8765/dist/index.json)"
          test "$STATUS" = 401

      - name: Reset mirror log before setup-node test
        run: |
          : > "$RUNNER_TEMP/node-mirror.log"

      # LTS alias resolution needs a GitHub manifest before any mirror fallback.
      - name: Test GitHub authentication with v6
        if: matrix.variant == 'v6'
        id: github-v6
        continue-on-error: true
        uses: actions/setup-node@v6
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/tc-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}-github
        with:
          node-version: lts/jod
          check-latest: true
          token: ${{ github.token }}
          mirror: http://127.0.0.1:8765
          mirror-token: ''
          package-manager-cache: false

      - name: Test GitHub authentication with PR branch
        if: matrix.variant == 'pr-1669'
        id: github-pr
        continue-on-error: true
        uses: EnesKartal/setup-node@fix/mirror-token-github-auth
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/tc-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}-github
        with:
          node-version: lts/jod
          check-latest: true
          token: ${{ github.token }}
          mirror: http://127.0.0.1:8765
          mirror-token: ''
          package-manager-cache: false

      - name: Prove token type after GitHub-path test
        if: always()
        run: |
          set -euo pipefail
          echo "---- setup-node mirror requests ----"
          grep '^MIRROR_REQ ' "$RUNNER_TEMP/node-mirror.log" || true
          echo "---- outcomes ----"
          echo "v6 outcome: ${{ steps.github-v6.outcome }}"
          echo "pr outcome: ${{ steps.github-pr.outcome }}"

      - name: Assert expected GitHub result
        env:
          ACTUAL: ${{ matrix.variant == 'v6' && steps.github-v6.outcome || steps.github-pr.outcome }}
          EXPECTED: ${{ matrix.github-outcome }}
        run: |
          set -euo pipefail
          echo "GitHub path: expected=$EXPECTED actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Stop temporary mirror
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/node-mirror.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/node-mirror.pid")"
          fi
