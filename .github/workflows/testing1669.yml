name: mirror-auth-behavior

on:
  workflow_dispatch:

jobs:
  mirror-no-mirror-token:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup node (mirror + token, no mirror-token)
        id: setup
        uses: actions/setup-node@v6
        with:
          node-version: '11.15.0'
          check-latest: true
          mirror: 'https://mirror.yandex.ru/mirrors/nodejs.org/'
          token: ${{ secrets.GITHUB_TOKEN }}
          package-manager-cache: false

      - name: Check whether header was passed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "setup outcome: ${{ steps.setup.outcome }}"
          echo "---- mirror requests ----"
          grep '^MIRROR_REQ ' "$RUNNER_TEMP/node-mirror.log" || true
          echo "---- token summary ----"
          grep -E 'token=(none|other-token|mirror-token)' "$RUNNER_TEMP/node-mirror.log" || true

      - name: Check Node version
        run: node -v
