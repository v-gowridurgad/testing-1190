name: Compare empty mirror-token behavior

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: v6.5.0
            expected: empty
          - variant: pr-1669
            expected: github

    steps:
      - name: Prepare request tracer and isolated cache
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/node-test-cache"

          cat > "$RUNNER_TEMP/trace-auth.cjs" <<'JS'
          const https = require('node:https');
          const fs = require('node:fs');
          const {syncBuiltinESMExports} = require('node:module');

          const originalRequest = https.request;

          https.request = function (...args) {
            const options = args[0];

            if (options && typeof options === 'object') {
              const host = options.hostname || options.host;
              const path = options.path || '';

              let kind;
              if (
                host === 'api.github.com' &&
                path.startsWith('/repos/actions/node-versions/git/trees/')
              ) {
                kind = 'manifest';
              } else if (
                host === 'github.com' &&
                path.startsWith('/actions/node-versions/releases/download/')
              ) {
                kind = 'download';
              }

              if (kind) {
                const headers = options.headers || {};
                const authEntry = Object.entries(headers).find(
                  ([name]) => name.toLowerCase() === 'authorization'
                );
                const auth = authEntry?.[1];
                const category = !auth
                  ? 'empty'
                  : auth === `token ${process.env.EXPECTED_GITHUB_TOKEN}`
                    ? 'github'
                    : 'other';

                // Record only the category, never the token.
                fs.appendFileSync(
                  process.env.AUTH_TRACE,
                  `${kind}=${category}\n`
                );
              }
            }

            return originalRequest.apply(this, args);
          };

          syncBuiltinESMExports();
          JS

      - name: Test v6.5.0
        if: matrix.variant == 'v6.5.0'
        uses: actions/setup-node@v6.5.0
        env:
          NODE_OPTIONS: --require ${{ runner.temp }}/trace-auth.cjs
          AUTH_TRACE: ${{ runner.temp }}/auth-trace.txt
          EXPECTED_GITHUB_TOKEN: ${{ github.token }}
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/node-test-cache
        with:
          node-version: '22.20.0'
          check-latest: true
          token: ${{ github.token }}
          mirror: https://nodejs.org
          mirror-token: ''

      - name: Test PR branch
        if: matrix.variant == 'pr-1669'
        uses: EnesKartal/setup-node@fix/mirror-token-github-auth
        env:
          NODE_OPTIONS: --require ${{ runner.temp }}/trace-auth.cjs
          AUTH_TRACE: ${{ runner.temp }}/auth-trace.txt
          EXPECTED_GITHUB_TOKEN: ${{ github.token }}
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/node-test-cache
        with:
          node-version: '22.20.0'
          check-latest: true
          token: ${{ github.token }}
          mirror: https://nodejs.org
          mirror-token: ''
          package-manager-cache: false

      - name: Verify request authentication
        shell: bash
        env:
          EXPECTED: ${{ matrix.expected }}
        run: |
          set -euo pipefail

          echo "Observed authorization categories:"
          cat "$RUNNER_TEMP/auth-trace.txt"

          grep -qx "manifest=$EXPECTED" "$RUNNER_TEMP/auth-trace.txt"
          grep -qx "download=$EXPECTED" "$RUNNER_TEMP/auth-trace.txt"

          if grep -Ev "^(manifest|download)=$EXPECTED$" \
              "$RUNNER_TEMP/auth-trace.txt"; then
            echo "::error::Unexpected authorization category"
            exit 1
          fi

          test "$(node --version)" = "v22.20.0"
