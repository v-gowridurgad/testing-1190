name: Verify empty mirror-token regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: v6.5.0
            ref: v6.5.0
            expected: empty
          - variant: pr-1669
            ref: 5a78ece28e5794ec899d41fd9f42dbf6dab68fcb
            expected: github

    steps:
      - name: Check out action being tested
        uses: actions/checkout@v7
        with:
          repository: actions/setup-node
          ref: ${{ matrix.ref }}
          path: action-under-test
          persist-credentials: false

      - name: Instrument token selection without logging credentials
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path('action-under-test/dist/setup/index.js')
          content = path.read_text()

          if os.environ['VARIANT'] == 'v6.5.0':
              auth = (
                  'this.nodeInfo.mirror ? '
                  'this.nodeInfo.mirrorToken : this.nodeInfo.auth'
              )
              download = 'tc.downloadTool'
              manifest = 'tc.getManifestFromRepo'
          else:
              auth = 'this.nodeInfo.auth'
              download = 'downloadTool'
              manifest = 'getManifestFromRepo'

          def trace(label):
              # Record only the selected category, never the token value.
              return (
                  "(process.getBuiltinModule('fs').appendFileSync("
                  "process.env.AUTH_TRACE, "
                  f"'{label}=' + "
                  f"(!({auth}) ? 'empty' : "
                  f"(({auth}) === this.nodeInfo.auth ? 'github' : 'other')) "
                  "+ '\\n'), "
                  f"({auth}))"
              )

          replacements = {
              f'{download}(versionInfo.downloadUrl, undefined, {auth})':
                  f'{download}(versionInfo.downloadUrl, undefined, {trace("download")})',
              f"{manifest}('actions', 'node-versions', {auth}, 'main')":
                  f"{manifest}('actions', 'node-versions', {trace('manifest')}, 'main')",
          }

          for original, replacement in replacements.items():
              if content.count(original) != 1:
                  raise SystemExit(
                      f'Expected exactly one matching call: {original}'
                  )
              content = content.replace(original, replacement, 1)

          path.write_text(content)
          PY

      - name: Prepare isolated tool cache
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/node-test-cache"

      - name: Run setup-node with mirror but no mirror-token
        uses: ./action-under-test
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/node-test-cache
          AUTH_TRACE: ${{ runner.temp }}/auth-trace.txt
        with:
          # Known to exist in the GitHub node-versions manifest.
          node-version: '22.20.0'
          check-latest: true
          token: ${{ github.token }}
          mirror: https://nodejs.org
          mirror-token: ''
          package-manager-cache: false

      - name: Check token selection
        shell: bash
        env:
          EXPECTED: ${{ matrix.expected }}
        run: |
          set -euo pipefail

          echo "Observed token categories:"
          cat "$RUNNER_TEMP/auth-trace.txt"

          grep -qx "manifest=$EXPECTED" "$RUNNER_TEMP/auth-trace.txt"
          grep -qx "download=$EXPECTED" "$RUNNER_TEMP/auth-trace.txt"

          test "$(node --version)" = "v22.20.0"
