name: reproduce-empty-mirror-token-manifest-auth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: v6
            setup-ref: actions/setup-node@v6
          - variant: pr
            setup-ref: EnesKartal/setup-node@fix/mirror-token-github-auth

    defaults:
      run:
        shell: bash

    steps:
      - name: Start strict local mirror (requires mirror token)
        id: mirror
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "authorization=Bearer $TOKEN" >> "$GITHUB_OUTPUT"
          export MIRROR_AUTH="Bearer $TOKEN"

          cat > "$RUNNER_TEMP/node-mirror.py" <<'PY'
          import hmac, os, shutil, urllib.error, urllib.request
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Mirror(BaseHTTPRequestHandler):
              def do_GET(self):
                  supplied = self.headers.get("Authorization", "")
                  expected = os.environ["MIRROR_AUTH"]

                  if supplied == "":
                      token_kind = "none"
                  elif hmac.compare_digest(supplied, expected):
                      token_kind = "mirror-token"
                  else:
                      token_kind = "other-token"

                  print(f"MIRROR_REQ token={token_kind} path={self.path}", flush=True)

                  if not hmac.compare_digest(supplied, expected):
                      self.send_error(401, "Invalid mirror token")
                      return

                  if not self.path.startswith("/dist/"):
                      self.send_error(404)
                      return

                  try:
                      upstream = urllib.request.urlopen("https://nodejs.org" + self.path, timeout=120)
                  except urllib.error.HTTPError as e:
                      self.send_error(e.code, "Upstream HTTP error")
                      return
                  except urllib.error.URLError:
                      self.send_error(502, "Cannot reach upstream")
                      return

                  with upstream:
                      self.send_response(200)
                      self.end_headers()
                      shutil.copyfileobj(upstream, self.wfile)

          ThreadingHTTPServer(("127.0.0.1", 8765), Mirror).serve_forever()
          PY

          python3 -u "$RUNNER_TEMP/node-mirror.py" > "$RUNNER_TEMP/node-mirror.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/node-mirror.pid"

      - name: Isolate cache
        run: |
          set -euo pipefail
          echo "RUNNER_TOOL_CACHE=${RUNNER_TEMP}/tc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.variant }}" >> "$GITHUB_ENV"
          rm -rf "${RUNNER_TEMP}/tc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.variant }}"
          mkdir -p "${RUNNER_TEMP}/tc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.variant }}"
          : > "$RUNNER_TEMP/node-mirror.log"

      - name: Trigger manifest path with empty mirror-token
        id: setup
        continue-on-error: true
        uses: ${{ matrix.setup-ref }}
        with:
          node-version: lts/jod
          check-latest: true
          token: ${{ github.token }}
          mirror: http://127.0.0.1:8765
          mirror-token: ''
          package-manager-cache: false

      - name: Evidence
        if: always()
        run: |
          set -euo pipefail
          echo "variant=${{ matrix.variant }}"
          echo "outcome=${{ steps.setup.outcome }}"
          echo "---- mirror requests ----"
          grep -a '^MIRROR_REQ ' "$RUNNER_TEMP/node-mirror.log" || true

      - name: Stop mirror
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/node-mirror.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/node-mirror.pid")"
          fi
