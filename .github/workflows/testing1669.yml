name: Compare mirror credentials (v7)

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  v7:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Start temporary authenticated mirror
        id: mirror
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "authorization=Bearer $TOKEN" >> "$GITHUB_OUTPUT"
          export MIRROR_AUTH="Bearer $TOKEN"
          cat > "$RUNNER_TEMP/node-mirror.py" <<'PY'
          import hmac
          import os
          import shutil
          import urllib.error
          import urllib.request
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          class Mirror(BaseHTTPRequestHandler):
              def do_GET(self):
                  supplied = self.headers.get("Authorization", "")
                  if not hmac.compare_digest(supplied, os.environ["MIRROR_AUTH"]):
                      self.send_error(401, "Invalid mirror token")
                      return
                  if not self.path.startswith("/dist/"):
                      self.send_error(404)
                      return
                  try:
                      upstream = urllib.request.urlopen("https://nodejs.org" + self.path, timeout=120)
                  except urllib.error.HTTPError as error:
                      self.send_error(error.code, "Upstream HTTP error")
                      return
                  except urllib.error.URLError:
                      self.send_error(502, "Cannot reach upstream")
                      return
                  with upstream:
                      self.send_response(200)
                      self.end_headers()
                      shutil.copyfileobj(upstream, self.wfile)
                  if self.path.endswith(".tar.gz"):
                      print("MIRROR_DOWNLOAD_OK", flush=True)
          ThreadingHTTPServer(("127.0.0.1", 8765), Mirror).serve_forever()
          PY
          python3 -u "$RUNNER_TEMP/node-mirror.py" > "$RUNNER_TEMP/node-mirror.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/node-mirror.pid"
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            -H "Authorization: $MIRROR_AUTH" \
            http://127.0.0.1:8765/dist/index.json --output /dev/null
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8765/dist/index.json)"
          test "$STATUS" = 401

      - name: Test GitHub authentication with v7
        id: github-v7
        continue-on-error: true
        uses: actions/setup-node@v7
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/github-path-cache
        with:
          node-version: 'lts/jod'
          check-latest: true
          token: ${{ github.token }}
          mirror: http://127.0.0.1:8765
          mirror-token: ${{ steps.mirror.outputs.authorization }}
          package-manager-cache: false

      - name: Assert expected GitHub result (v7 should fail)
        env:
          ACTUAL: ${{ steps.github-v7.outcome }}
        run: |
          set -euo pipefail
          echo "GitHub path: expected=failure actual=$ACTUAL"
          test "$ACTUAL" = "failure"

      - name: Test authenticated mirror fallback with v7
        uses: actions/setup-node@v7
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/mirror-path-cache
        with:
          node-version: '11.15.0'
          token: ${{ github.token }}
          mirror: http://127.0.0.1:8765
          mirror-token: ${{ steps.mirror.outputs.authorization }}
          package-manager-cache: false

      - name: Verify mirror served archive
        run: |
          set -euo pipefail
          grep -q '^MIRROR_DOWNLOAD_OK$' "$RUNNER_TEMP/node-mirror.log"
          test "$(node --version)" = v11.15.0

      - name: Show mirror request log
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/node-mirror.log" ] && cat "$RUNNER_TEMP/node-mirror.log" || true

      - name: Stop temporary mirror
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/node-mirror.pid" ] && kill "$(cat "$RUNNER_TEMP/node-mirror.pid")" || true
