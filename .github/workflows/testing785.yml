name: repro-native-cache

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Restore native build caches
        id: nm  
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
            .yarn/install-state.gz
          key: nm-${{ runner.os }}-${{ runner.arch }}-node16-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        if: steps.nm.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

       
  
